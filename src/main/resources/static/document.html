<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document — Skip The Syllabus</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050605;--lime:#C5FF4A;--text:#e8ffe8;--text-muted:#7a8a70;--card-bg:#0d110c;--border:#1a2218;--radius:12px}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;min-height:100vh}
.sidebar{width:240px;min-height:100vh;background:var(--card-bg);border-right:1px solid var(--border);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:.5rem;position:fixed;top:0;left:0;bottom:0}
.logo{font-size:1rem;font-weight:800;color:var(--lime);margin-bottom:1.5rem;padding:0 .5rem}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.625rem .75rem;border-radius:8px;color:var(--text-muted);font-size:.875rem;cursor:pointer;transition:all .15s;text-decoration:none}
.nav-item:hover,.nav-item.active{background:rgba(197,255,74,.08);color:var(--lime)}
.main{margin-left:240px;flex:1;padding:2rem;max-width:calc(100vw - 240px)}
/* Doc header */
.doc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap}
.doc-title h1{font-size:1.4rem;font-weight:800;letter-spacing:-.5px;word-break:break-all}
.doc-meta{color:var(--text-muted);font-size:.8rem;margin-top:.25rem}
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.7rem;font-weight:600;margin-left:.5rem}
.badge-ready{background:rgba(197,255,74,.15);color:var(--lime)}
.badge-processing{background:rgba(255,165,0,.15);color:orange}
.badge-failed{background:rgba(255,80,80,.15);color:#ff6060}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{padding:.75rem 1.5rem;font-size:.9rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);transition:all .15s}
.tab.active{color:var(--lime);border-bottom-color:var(--lime)}
.tab-content{display:none}
.tab-content.active{display:block}
/* Explain */
.input-group{margin-bottom:1rem}
.input-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.5px}
.input-group input,.input-group select,.input-group textarea{width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.9rem;outline:none;transition:border-color .15s;font-family:inherit}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--lime)}
.input-group select option{background:var(--card-bg)}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.625rem 1.25rem;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-lime{background:var(--lime);color:#050605}
.btn-lime:hover{background:#d9ff6a;transform:translateY(-1px)}
.btn-lime:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime)}
/* Explain result */
.explain-result{margin-top:1.5rem}
.explain-section{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
.explain-section h3{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--lime);margin-bottom:.75rem}
.explain-section p{font-size:.9rem;line-height:1.7;white-space:pre-wrap}
/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:65vh;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card-bg)}
.chat-messages{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:.875rem}
.msg{max-width:75%;padding:.75rem 1rem;border-radius:10px;font-size:.875rem;line-height:1.6;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:rgba(197,255,74,.15);border:1px solid rgba(197,255,74,.3);color:var(--text)}
.msg.ai{align-self:flex-start;background:#111;border:1px solid var(--border);color:var(--text)}
.msg.ai .msg-label{font-size:.7rem;color:var(--lime);font-weight:700;margin-bottom:.35rem}
.chat-input-row{display:flex;gap:.5rem;padding:1rem;border-top:1px solid var(--border);background:var(--card-bg)}
.chat-input-row input{flex:1;background:#111;border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.875rem;outline:none;font-family:inherit}
.chat-input-row input:focus{border-color:var(--lime)}
/* Spinner */
.typing{display:flex;gap:4px;align-items:center;padding:.5rem 0}
.typing span{width:6px;height:6px;background:var(--lime);border-radius:50%;animation:bounce .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.empty-state{text-align:center;padding:2rem;color:var(--text-muted)}
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="logo">⚡ SKIP THE SYLLABUS</div>
  <a class="nav-item" href="dashboard.html">📊 Dashboard</a>
  <a class="nav-item" href="upload.html">📤 Upload PDF</a>
  <a class="nav-item" href="quiz.html">⚡ Quiz Lab</a>
  <a class="nav-item" href="explorer.html">🔮 3D Explorer</a>
  <a class="nav-item" href="settings.html">⚙️ Settings</a>
  <a class="nav-item" href="index.html" style="margin-top:auto">🏠 Home</a>
</nav>

<main class="main">
  <div class="doc-header">
    <div class="doc-title">
      <h1 id="docName">Loading document...</h1>
      <div class="doc-meta" id="docMeta"></div>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <a id="quizBtn" href="#" class="btn btn-lime">⚡ Generate Quiz</a>
      <a href="upload.html" class="btn btn-ghost">← Back</a>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('explain', this)">🧠 Explain</div>
    <div class="tab" onclick="switchTab('chat', this)">💬 Chat</div>
  </div>

  <!-- EXPLAIN TAB -->
  <div class="tab-content active" id="tab-explain">
    <div class="input-group">
      <label>What do you want explained?</label>
      <input type="text" id="concept" placeholder='e.g. "binary search tree", "photosynthesis", "the main argument"' />
    </div>
    <div class="input-group">
      <label>Complexity level</label>
      <select id="level">
        <option value="beginner">🟢 Beginner — Explain like I'm 5</option>
        <option value="intermediate" selected>🟡 Intermediate — Some jargon OK</option>
        <option value="advanced">🔴 Advanced — Full technical depth</option>
      </select>
    </div>
    <button class="btn btn-lime" id="explainBtn" onclick="doExplain()">🧠 Explain This</button>
    <div id="explainResult" class="explain-result" style="display:none"></div>
  </div>

  <!-- CHAT TAB -->
  <div class="tab-content" id="tab-chat">
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state">💬 Ask anything about this document. I'll answer only from what's in it.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask a question about the document..." onkeydown="if(event.key==='Enter')sendChat()" />
        <button class="btn btn-lime" onclick="sendChat()">Send →</button>
      </div>
    </div>
  </div>
</main>

<script>
const API = '';
const params = new URLSearchParams(location.search);
const docId = params.get('id');
let chatHistory = [];
let doc = null;

if (!docId) { location.href = 'upload.html'; }

async function loadDoc() {
  try {
    const res = await fetch(API + '/api/documents/' + docId);
    const data = await res.json();
    doc = data.data;
    document.getElementById('docName').textContent = doc.originalFilename;
    const meta = [
      doc.pageCount ? doc.pageCount + ' pages' : null,
      doc.fileSize ? fmtSize(doc.fileSize) : null,
      '<span class="badge badge-' + doc.status.toLowerCase() + '">' + doc.status + '</span>'
    ].filter(Boolean).join(' · ');
    document.getElementById('docMeta').innerHTML = meta;
    document.getElementById('quizBtn').href = 'quiz.html?docId=' + docId;

    if (doc.status !== 'READY') {
      document.getElementById('explainBtn').disabled = true;
      document.getElementById('chatInput').disabled = true;
      document.getElementById('explainBtn').textContent = '⏳ Document not ready';
    }
  } catch(e) { document.getElementById('docName').textContent = 'Error loading document'; }
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');

  // honour ?tab= param
  const tab = params.get('tab');
  if (tab && name !== tab) {
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.tab-content');
    const idx = tab === 'chat' ? 1 : 0;
    tabs.forEach(t=>t.classList.remove('active')); tabs[idx].classList.add('active');
    contents.forEach(t=>t.classList.remove('active')); contents[idx].classList.add('active');
  }
}

// Open on correct tab if URL has ?tab=
(function() {
  const tab = params.get('tab');
  if (tab === 'chat') {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('tab-chat').classList.add('active');
  }
})();

// ── EXPLAIN ──────────────────────────────────────────────────────
async function doExplain() {
  const concept = document.getElementById('concept').value.trim();
  const level = document.getElementById('level').value;
  if (!concept) { alert('Please enter a concept to explain.'); return; }

  const btn = document.getElementById('explainBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Thinking...';
  document.getElementById('explainResult').style.display = 'none';

  try {
    const res = await fetch(API + '/api/documents/' + docId + '/explain', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ concept, level })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    renderExplain(data.data);
  } catch(e) {
    document.getElementById('explainResult').innerHTML = '<div class="explain-section"><p style="color:#ff6060">Error: ' + esc(e.message) + '</p></div>';
    document.getElementById('explainResult').style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🧠 Explain This';
  }
}

function renderExplain(d) {
  const sections = [
    { key: 'intuition', label: '💡 Intuition', icon: '' },
    { key: 'breakdown', label: '🔬 Breakdown', icon: '' },
    { key: 'example',   label: '📌 Example',   icon: '' },
    { key: 'keyTakeaways', label: '🎯 Key Takeaways', icon: '' },
    { key: 'selfCheck', label: '✅ Self-Check', icon: '' },
  ];
  const badge = d.aiGenerated ? '<span class="badge badge-ready">Grok AI</span>' : '<span class="badge" style="background:rgba(150,150,150,.15);color:#aaa">Local Mode</span>';
  const pagesBadge = d.pageReferences && d.pageReferences.length > 0
    ? `<span class="badge" style="background:rgba(197,255,74,0.12);color:var(--lime);border:1px solid rgba(197,255,74,0.3)">📖 Source Pages: ${d.pageReferences.join(', ')}</span>`
    : '';

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
        <strong>${esc(d.concept)}</strong>
        ${badge}
        ${pagesBadge}
        <span style="color:var(--text-muted);font-size:.8rem">Level: ${esc(d.level)}</span>
      </div>
      <button class="btn btn-ghost" style="font-size:.75rem;padding:.3rem .6rem" onclick="copyExplainText()">📋 Copy</button>
    </div>`;

  sections.forEach(s => {
    const val = d[s.key];
    if (val && val.trim()) {
      html += '<div class="explain-section"><h3>' + s.label + '</h3><p>' + esc(val) + '</p></div>';
    }
  });
  const el = document.getElementById('explainResult');
  el.innerHTML = html;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyExplainText() {
  const el = document.getElementById('explainResult');
  navigator.clipboard.writeText(el.innerText || '');
  alert('Explanation copied to clipboard!');
}

// ── CHAT ─────────────────────────────────────────────────────────
async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  input.disabled = true;

  const msgsEl = document.getElementById('chatMessages');
  // Clear placeholder
  if (chatHistory.length === 0) msgsEl.innerHTML = '';

  // User bubble
  msgsEl.innerHTML += '<div class="msg user">' + esc(msg) + '</div>';
  chatHistory.push({ role: 'user', content: msg });
  msgsEl.scrollTop = msgsEl.scrollHeight;

  // Typing indicator
  const typingId = 'typing-' + Date.now();
  msgsEl.innerHTML += `<div id="${typingId}" class="msg ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgsEl.scrollTop = msgsEl.scrollHeight;

  try {
    const res = await fetch(API + '/api/documents/' + docId + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: msg, history: chatHistory.slice(-10) })
    });
    const data = await res.json();
    const reply = data.data?.answer || 'No response received.';
    const pages = data.data?.pageReferences || [];
    const citationsHtml = pages.length > 0
      ? `<div style="font-size:0.75rem;color:var(--lime);margin-top:0.4rem;font-weight:600">📖 Grounded in Pages: ${pages.join(', ')}</div>`
      : '';
    chatHistory.push({ role: 'assistant', content: reply });

    document.getElementById(typingId).outerHTML =
      '<div class="msg ai"><div class="msg-label">Skip The Syllabus AI</div>' + esc(reply) + citationsHtml + '</div>';
  } catch(e) {
    document.getElementById(typingId).outerHTML =
      '<div class="msg ai" style="color:#ff6060">Error: ' + esc(e.message) + '</div>';
  } finally {
    input.disabled = false;
    input.focus();
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
}

function esc(s) { const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function fmtSize(b) { if(!b)return'?'; if(b<1048576)return(b/1024).toFixed(1)+'KB'; return(b/1048576).toFixed(1)+'MB'; }

loadDoc();
</script>
</body>
</html>
