spring.application.name=skip-the-syllabus

# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/skipthesyllabus;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# xAI Grok API Configuration
xai.api.key=${XAI_API_KEY:}
xai.api.base-url=https://api.x.ai/v1
xai.api.model=${XAI_MODEL:grok-2-1212}
xai.api.timeout-seconds=60
xai.api.max-tokens=2048
xai.api.max-context-chars=80000

# App Configuration
app.upload.max-size-bytes=52428800
app.upload.allowed-extensions=pdf
app.processing.thread-pool-size=4

# Logging (never log secrets)
logging.level.com.skipthesyllabus=INFO
logging.level.org.springframework.web=WARN
